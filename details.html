<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Studio A artwork details">
  <title>Artwork | Studio A</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="details.css">
</head>
<body>
  <main class="art-page">
    <section class="exhibition" id="exhibition">
      <header class="exhibition-header">
        <a href="gallery.html" class="back-link"><i class="fa-solid fa-angle-left"></i> Back</a>
        <a href="home.html" class="studio-logo">Studio <span>–</span> A</a>
        <p class="counter"><span id="current-number">01</span> / <span id="total-number">14</span></p>
      </header>

      <div class="art-stage">
        <figure class="artwork-frame">
          <img id="art-image" src="" alt="">
          <figcaption id="art-caption"></figcaption>
        </figure>
      </div>

      <article class="details-card" aria-live="polite">
        <div class="details-scroll" id="details-scroll">
          <p class="eyebrow" id="art-collection"></p>
          <h1 id="art-title">Loading artwork…</h1>
          <p class="artist" id="art-artist"></p>

          <img class="detail-preview" id="detail-image" src="" alt="">

          <p class="description" id="art-description"></p>

            <section class="art-story">
                <p class="story-label">The story behind the frame</p>
                <h2 id="story-heading"></h2>
                <div id="art-story"></div>
            </section>
            
          <dl class="object-data">
            <div><dt>Medium</dt><dd id="art-medium"></dd></div>
            <div><dt>Date</dt><dd id="art-date"></dd></div>
            <div><dt>Location</dt><dd id="art-location"></dd></div>
            <div><dt>Collection</dt><dd id="art-ownership"></dd></div>
          </dl>


        </div>
      </article>

      <div class="error-message" id="error-message" hidden>
        <h1>Artwork not found</h1>
        <p>The requested photograph is unavailable.</p>
        <a href="gallery.html">Return to gallery</a>
      </div>
    </section>
  </main>
  <script src="details.js"></script>
</body>
</html>
